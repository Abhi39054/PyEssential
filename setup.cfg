[metadata]
name = pyessential
version = attr: pyessential._version.__version__
author = Abhishek Kumar
author_email = abhishekkumar39054@gmail.com
maintainer = Abhishek Kumar
description = A growing collection of Python utilities and decorators.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Abhi39054/PyEssential.git
license = MIT
# List of standard classifiers: https://pypi.org/classifiers/
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
# Automatically find the 'pyessential' package and all its sub-packages 
# (decorators, functions, etc.)
packages = find:
install_requires =
    # Add external dependencies here, e.g., pandas
    # pandas>=1.3.0
python_requires = >=3.9

[options.packages.find]
# Exclude the test folder from being packaged
exclude =
    tests*

[options.entry_points]
console_scripts =
    pyessential = pyessential.cli:main